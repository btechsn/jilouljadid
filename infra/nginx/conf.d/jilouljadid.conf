# Reverse proxy Jiloul Jadid
# Domaine : jilouljadid.com (hébergé VPS LWS 185.98.139.60)

upstream php_backend {
    server app:9000;
}

upstream next_frontend {
    server next:3000;
}

upstream reverb_ws {
    server reverb:8080;
}

limit_req_zone $binary_remote_addr zone=api_limit:10m rate=60r/m;
limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=5r/m;

server {
    listen 80;
    server_name jilouljadid.com www.jilouljadid.com;

    client_max_body_size 100M;

    location ~ ^/api/v1/webhooks/mediamtx {
        root /var/www/backend/public;
        try_files $uri /index.php$is_args$args;

        location ~ \.php$ {
            fastcgi_pass php_backend;
            fastcgi_index index.php;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            include fastcgi_params;
            fastcgi_read_timeout 10;
        }
    }

    location ~ ^/(api|sanctum|broadcasting) {
        limit_req zone=api_limit burst=20 nodelay;
        root /var/www/backend/public;
        try_files $uri /index.php$is_args$args;

        location ~ \.php$ {
            fastcgi_pass php_backend;
            fastcgi_index index.php;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            include fastcgi_params;
            fastcgi_buffer_size 128k;
            fastcgi_buffers 256 16k;
            fastcgi_busy_buffers_size 256k;
            fastcgi_read_timeout 300;
        }
    }

    location ~ ^/(api/v1/auth|sanctum/csrf-cookie) {
        limit_req zone=auth_limit burst=3 nodelay;
        root /var/www/backend/public;
        try_files $uri /index.php$is_args$args;

        location ~ \.php$ {
            fastcgi_pass php_backend;
            fastcgi_index index.php;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            include fastcgi_params;
        }
    }

    location ~ ^/(institut/administration|livewire) {
        root /var/www/backend/public;
        try_files $uri /index.php$is_args$args;

        location ~ \.php$ {
            fastcgi_pass php_backend;
            fastcgi_index index.php;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            include fastcgi_params;
            fastcgi_buffer_size 128k;
            fastcgi_buffers 256 16k;
            fastcgi_busy_buffers_size 256k;
        }
    }

    location ^~ /css/ {
        root /var/www/backend/public;
        try_files $uri =404;
        access_log off;
    }

    location ^~ /js/ {
        root /var/www/backend/public;
        try_files $uri =404;
        access_log off;
    }

    location /storage/ {
        alias /var/www/backend/storage/app/public/;
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location /ws {
        proxy_pass http://reverb_ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
    }

    location = /index.php {
        root /var/www/backend/public;
        include fastcgi_params;
        fastcgi_pass php_backend;
        fastcgi_param SCRIPT_FILENAME $document_root/index.php;
        fastcgi_param HTTP_X_FORWARDED_PROTO $http_x_forwarded_proto;
        fastcgi_param HTTP_X_FORWARDED_FOR $proxy_add_x_forwarded_for;
        fastcgi_param HTTPS $fastcgi_https;
        fastcgi_buffer_size 128k;
        fastcgi_buffers 256 16k;
        fastcgi_busy_buffers_size 256k;
        fastcgi_read_timeout 300;
    }

    location / {
        proxy_pass http://next_frontend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_redirect off;
    }

    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    location ~ \.(env|log|git|sql)$ {
        deny all;
        access_log off;
        log_not_found off;
    }
}

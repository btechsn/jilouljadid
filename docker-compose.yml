# Jiloul Jadid — stack production (VPS LWS)
# Usage : docker compose --env-file .env up -d --build

services:
  nginx:
    image: nginx:1.25-alpine
    container_name: jj_nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./infra/nginx/conf.d:/etc/nginx/conf.d:ro
      - ./backend/public:/var/www/backend/public:ro
      - backend_storage:/var/www/backend/storage/app/public:ro
      # Sur le VPS : LETSENCRYPT_PATH=/etc/letsencrypt dans .env
      - ${LETSENCRYPT_PATH:-./infra/certs}:/etc/letsencrypt:ro
    depends_on:
      - app
      - next
      - reverb
    networks:
      - jj
    restart: unless-stopped

  app:
    build:
      context: ./infra/php
      dockerfile: Dockerfile
    container_name: jj_app
    env_file:
      - .env
    working_dir: /var/www/backend
    volumes:
      - ./backend:/var/www/backend
      - ./frontend/messages:/var/www/frontend/messages:ro
      - backend_storage:/var/www/backend/storage/app/public
      - ./infra/php/php.ini:/usr/local/etc/php/conf.d/custom.ini:ro
      - ./infra/php/entrypoint.sh:/usr/local/bin/entrypoint.sh:ro
    environment:
      APP_ENV: ${APP_ENV:-production}
      APP_DEBUG: ${APP_DEBUG:-false}
      APP_URL: ${APP_URL}
      ASSET_URL: ${ASSET_URL}
      FRONTEND_URL: ${FRONTEND_URL}
      APP_KEY: ${APP_KEY}
      SESSION_DOMAIN: ${SESSION_DOMAIN:-}
      SANCTUM_STATEFUL_DOMAINS: ${SANCTUM_STATEFUL_DOMAINS:-}
      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_PORT: 5432
      DB_DATABASE: ${DB_DATABASE}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      REVERB_HOST: reverb
      REVERB_PORT: 8080
      CACHE_STORE: redis
      SESSION_DRIVER: redis
      QUEUE_CONNECTION: redis
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - jj
      - internal
    restart: unless-stopped

  queue:
    build:
      context: ./infra/php
      dockerfile: Dockerfile
    container_name: jj_queue
    env_file:
      - .env
    working_dir: /var/www/backend
    command: php artisan queue:work --sleep=3 --tries=3 --max-time=3600
    volumes:
      - ./backend:/var/www/backend
      - backend_storage:/var/www/backend/storage/app/public
      - ./infra/php/entrypoint.sh:/usr/local/bin/entrypoint.sh:ro
    environment:
      APP_ENV: ${APP_ENV:-production}
      APP_KEY: ${APP_KEY}
      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_PORT: 5432
      DB_DATABASE: ${DB_DATABASE}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      REDIS_HOST: redis
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      QUEUE_CONNECTION: redis
    depends_on:
      - app
    networks:
      - internal
    restart: unless-stopped

  scheduler:
    build:
      context: ./infra/php
      dockerfile: Dockerfile
    container_name: jj_scheduler
    env_file:
      - .env
    working_dir: /var/www/backend
    command: sh -c "while true; do php artisan schedule:run --verbose --no-interaction; sleep 60; done"
    volumes:
      - ./backend:/var/www/backend
      - ./infra/php/entrypoint.sh:/usr/local/bin/entrypoint.sh:ro
    environment:
      APP_ENV: ${APP_ENV:-production}
      APP_KEY: ${APP_KEY}
      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_PORT: 5432
      DB_DATABASE: ${DB_DATABASE}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      REDIS_HOST: redis
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    depends_on:
      - app
    networks:
      - internal
    restart: unless-stopped

  reverb:
    build:
      context: ./infra/php
      dockerfile: Dockerfile
    container_name: jj_reverb
    env_file:
      - .env
    working_dir: /var/www/backend
    command: php artisan reverb:start --host=0.0.0.0 --port=8080
    volumes:
      - ./backend:/var/www/backend
      - ./infra/php/entrypoint.sh:/usr/local/bin/entrypoint.sh:ro
    environment:
      APP_ENV: ${APP_ENV:-production}
      APP_KEY: ${APP_KEY}
      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_PORT: 5432
      DB_DATABASE: ${DB_DATABASE}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      REVERB_APP_ID: ${REVERB_APP_ID}
      REVERB_APP_KEY: ${REVERB_APP_KEY}
      REVERB_APP_SECRET: ${REVERB_APP_SECRET}
      REDIS_HOST: redis
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    depends_on:
      - redis
    networks:
      - jj
      - internal
    restart: unless-stopped

  next:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL}
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
        NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL}
        NEXT_PUBLIC_ADMIN_URL: ${NEXT_PUBLIC_ADMIN_URL}
    container_name: jj_next
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL}
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
      NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL}
      NEXT_PUBLIC_ADMIN_URL: ${NEXT_PUBLIC_ADMIN_URL}
    networks:
      - jj
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    container_name: jj_db
    environment:
      POSTGRES_DB: ${DB_DATABASE}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d ${DB_DATABASE}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - internal
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: jj_redis
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    networks:
      - internal
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  backend_storage:

networks:
  jj:
    driver: bridge
  internal:
    driver: bridge
    internal: true
